name: Frontend CI
on:
  pull_request:
  push:
    branches: [main, Development]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-vcpkg-cache
      VCPKG_MAX_CONCURRENCY: 2
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-vcpkg-cache
          key: frontend-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: frontend-windows-
      - shell: pwsh
        run: ./.github/scripts/setup-vcpkg.ps1
      - shell: pwsh
        run: |
          cmake --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset x64-release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir out/build/x64-release -L local --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_update_signing_keys.py -v
