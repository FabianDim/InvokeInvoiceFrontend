name: Frontend CI
on:
  pull_request:
    branches: [main, Development]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, Development]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: All available tests
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-vcpkg-cache
      VCPKG_MAX_CONCURRENCY: 2
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check promotion validation
        run: python -m unittest discover -s tests -p test_promotion_validation.py -v
      - name: Reuse verified Development tests
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/promotion-validation.py verify
      - uses: ilammy/msvc-dev-cmd@v1
        if: github.base_ref != 'main'
        with:
          arch: x64
      - uses: actions/cache@v4
        if: github.base_ref != 'main'
        with:
          path: ${{ github.workspace }}/.ci-vcpkg-cache
          key: frontend-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: frontend-windows-
      - shell: pwsh
        if: github.base_ref != 'main'
        run: ./.github/scripts/setup-vcpkg.ps1
      - shell: pwsh
        if: github.base_ref != 'main'
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          cmake --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset x64-release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir out/build/x64-release --output-on-failure --no-tests=error --output-junit "$env:GITHUB_WORKSPACE/test-results/ctest.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_update_signing_keys.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record the tested source tree
        if: github.event_name == 'pull_request' && github.base_ref == 'Development'
        run: python .github/scripts/promotion-validation.py record
      - name: Save test results
        if: always() && github.base_ref != 'main'
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
