name: Release frontend
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: frontend-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-vcpkg-cache
      VCPKG_MAX_CONCURRENCY: 2
      VCPKG_DISABLE_METRICS: 1
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release tag' }
            $version = $env:RELEASE_TAG.Substring(1)
          } else {
            $output = python .github/scripts/release-version.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $version = $output -replace '^version=', ''
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - name: Require update signing configuration
        shell: pwsh
        env:
          UPDATE_SIGNING_CONFIGURED: ${{ secrets.INVOICE_UPDATE_SIGNING_KEY != '' }}
        run: |
          if ($env:UPDATE_SIGNING_CONFIGURED -ne 'true') {
            throw 'Configure INVOICE_UPDATE_SIGNING_KEY before publishing an update-enabled frontend.'
          }
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci-vcpkg-cache
          key: frontend-static-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/*') }}
          restore-keys: frontend-static-windows-
      - shell: pwsh
        run: ./.github/scripts/setup-vcpkg.ps1
      - shell: pwsh
        run: |
          cmake --preset x64-static-release "-DINVOICE_APP_VERSION=$env:APP_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset x64-static-release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir out/build/x64-static-release --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_update_signing_keys.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.github/scripts/package-frontend.ps1 -Version $env:APP_VERSION -BuildDirectory out/build/x64-static-release -Static
      - name: Save standalone frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend-windows
          path: |
            out/release/*.exe
            out/release/*-licenses.txt
            out/release/*.sha256
          if-no-files-found: error
      - name: Sign exact executable
        shell: pwsh
        env:
          INVOICE_UPDATE_SIGNING_KEY: ${{ secrets.INVOICE_UPDATE_SIGNING_KEY }}
        run: |
          python .github/scripts/sign-update.py --version $env:APP_VERSION --asset "out/release/InvokeInvoiceSystem-$env:APP_VERSION-windows-x64.exe" --output-dir out/release --openssl 'C:/Program Files/Git/usr/bin/openssl.exe'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagCommit = git rev-parse --verify "refs/tags/$($env:RELEASE_TAG)^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag $env:RELEASE_TAG already belongs to another commit."
          }
          $assets = @(Get-ChildItem out/release -File | Where-Object { $_.Name -match '\.(exe|sha256|json|sig)$|licenses\.txt$' } | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --draft --title "Invoke Invoice $env:APP_VERSION" --generate-notes
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($draft -eq 'true') {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $env:RELEASE_TAG --draft=false --latest
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
